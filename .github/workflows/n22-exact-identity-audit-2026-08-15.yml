name: n22 exact identity encoding audit 2026-08-15

on:
  push:
    branches:
      - webchat/n22-certificate-defect-2026-08-15
    paths:
      - .github/workflows/n22-exact-identity-audit-2026-08-15.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 22x22/webchat/2026-08-15-certificate-defect/verify_exact_identity_encoding.py
