name: n22 weight-15 exact Farkas audit 2026-08-16

on:
  push:
    branches:
      - webchat/n22-certificate-defect-2026-08-15
    paths:
      - .github/workflows/n22-farkas-weight15-audit-2026-08-16.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-audit dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy
      - name: Reconstruct and verify every integer Farkas certificate
        run: |
          cd 22x22/webchat/2026-08-15-certificate-defect
          python verify_refined_15_count_exact.py
          python verify_farkas_weight15_94_dynamic.py --output weight15-farkas-94-certificates.json
      - uses: actions/upload-artifact@v4
        with:
          name: n22-weight15-farkas-94-certificates
          path: 22x22/webchat/2026-08-15-certificate-defect/weight15-farkas-94-certificates.json
          retention-days: 14
